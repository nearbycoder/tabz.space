<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Tabz options</title>
		<style>
			body { font: 14px system-ui, sans-serif; max-width: 420px; margin: 32px auto; padding: 0 16px; color: #0f172a; }
			label { display: block; margin: 16px 0 6px; font-weight: 600; }
			input[type="url"] { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
			button { margin-top: 20px; padding: 8px 14px; border: 0; border-radius: 8px; background: #6366f1; color: white; font-weight: 600; cursor: pointer; }
			.hint { color: #64748b; font-size: 12px; }
		</style>
	</head>
	<body>
		<h1>Tabz</h1>
		<label for="baseUrl">Server</label>
		<input id="baseUrl" type="url" placeholder="https://tabz.space" />
		<p class="hint">Only change this if you self-host tabz.</p>
		<label><input id="newTab" type="checkbox" /> Open tabz on every new tab</label>
		<button id="save" type="button">Save</button>
		<span id="status" class="hint"></span>
		<script type="module" src="options.js"></script>
	</body>
</html>
